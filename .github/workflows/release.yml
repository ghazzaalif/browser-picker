name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Vet (Windows)
        run: GOOS=windows go vet . || true
      - name: Build
        run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/BrowserPicker.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/BrowserPicker-ARM64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserPicker
          path: dist/*.exe
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/BrowserPicker.exe dist/BrowserPicker-ARM64.exe --clobber --repo "$GITHUB_REPOSITORY"
